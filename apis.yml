aid: broadlume
name: Broadlume
description: Broadlume is an all-in-one business platform for the flooring industry, serving more than
  4,000 retailers and 300+ manufacturers. Its products span lead-generating websites, digital advertising,
  SEO and reputation management, product catalogs, and a suite of flooring business software covering
  accounting, inventory management, job costing, and lead management, plus a retail selling system with
  in-store visualization and e-commerce sample ordering. Broadlume publishes a public developer portal
  at developer.broadlume.com documenting the Broadlume BMS API — the REST interface to its flooring ERP,
  formerly known as RollMaster, which Broadlume acquired in November 2021 — covering orders, quotes,
  leads, customers, products, inventory, purchase orders, invoicing, accounts receivable, general ledger,
  installation scheduling and handheld barcode operations. Broadlume is owned by Cyncly.
