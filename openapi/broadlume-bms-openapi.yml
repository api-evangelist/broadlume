          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
    post:
      operationId: createOrderLine
      summary: Create Order Line
      tags:
      - Order
      description: Creates a line on an existing order. Returns the key (header info) of the order updated. <br><br> Only
        one of these parameters (ordlseq, ordlb2bsku, ordlbarcode) is required. If more than one is passed they execute in
        the precedence of  ordlseq > ordlb2bsku > ordlbarcode
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  maxLength: 2
                  description: RollMaster company.
                branch:
                  type: string
                  maxLength: 2
                  description: RollMaster branch.
                order:
                  type: string
                  maxLength: 6
                ordlseq:
                  type: string
                  maxLength: 13
                  description: Catalog sequence
                ordlb2bsku:
                  type: string
                  maxLength: 30
                ordlbarcode:
                  type: string
                  maxLength: 30
                ordlwqty:
                  type: string
                  maxLength: 9
                ordlsqty:
                  type: string
                  maxLength: 9
                ordlprice:
                  type: string
                  maxLength: 9
                laborunitcost:
                  type: string
                  maxLength: 9
                taxable:
                  type: string
                  maxLength: 1
                  description: Y or N
              required:
              - company
              - branch
              - order
      responses:
        '200':
          description: OK
