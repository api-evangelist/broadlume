  /{alias}/linecomments:
    post:
      operationId: createOrderLineComment
      summary: Create Order Line Comment
      tags:
      - Order
      description: Creates an order line comment.
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  maxLength: 2
                  description: RollMaster company.
                branch:
                  type: string
                  maxLength: 2
                  description: RollMaster branch.
                job:
                  type: string
                  maxLength: 6
                lnnum:
                  type: string
                  maxLength: 3
                linenote:
                  type: string
                  maxLength: 70
                commenttype:
                  type: string
                  maxLength: 1
                  description: W = work order, C = customer, B= both, N = none
              required:
              - company
              - branch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  OLC_CODIV:
                    type: string
                  OLC_WHSE:
                    type: string
                  OLC_ORDNO:
                    type: string
                  OLC_LNNUM:
                    type: string
                  OLC_SEQ:
