                    type: string
                  DMO_WHSE:
                    type: string
                  DMH_CUSTID:
                    type: string
                  DMH_SHNAME:
                    type: string
                  DMH_SHCODE:
                    type: string
                  DMH_SHADDR1:
                    type: string
                  DMH_SHADDR2:
                    type: string
                  DMH_SHCTYST:
                    type: string
                  DMH_SHZIP:
                    type: string
                  DMH_SALESREP1:
                    type: string
                  DMH_SALESREP2:
                    type: string
                  DMH_SPECIAL1:
                    type: string
                  DMH_CUSTPO:
                    type: string
                  DMH_QRDNO:
                    type: string
                  DMH_STATUSCODE:
                    type: string
                  DMH_DATE:
                    type: string
                  DMH_INSTALLDATE:
                    type: string
                  DMH_SHPHONE1:
                    type: string
                  DMH_SHFAX:
                    type: string
                  DMH_SHCONTACT:
                    type: string
                  DMH_ORDEREDBY:
                    type: string
                  DMH_INSTALL_TIME:
                    type: string
                  SAL_NAME:
                    type: string
                  PODMO_WEB_USER:
                    type: string
                  DMH_JOBTOTAL:
                    type: string
                  DMH_BLDG:
                    type: string
                  DMH_UNIT:
                    type: string
                  DMH_SHCITY:
                    type: string
                  DMH_SHSTATE:
                    type: string
  /{alias}/orderlineinstaller:
    patch:
      operationId: updateOrderLineInstallerSingleDateOnly
      summary: Update Order Line Installer (Single Date Only)
      tags:
      - Order
      description: 'Sets/updates the installer for a single labor line

        Single Intall Date Only'
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: branch
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster branch.
      - name: order
        in: query
        required: true
        schema:
          type: string
          maxLength: 6
      - name: lnnum
        in: query
        required: true
        schema:
          type: string
          maxLength: 3
      - name: installer
        in: query
        required: true
        schema:
          type: string
          maxLength: 8
      - name: taxable
        in: query
        required: false
        schema:
          type: string
          maxLength: 1
        description: Y or N
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  RETURN:
                    type: string
  /{alias}/orderline:
    get:
      operationId: getOrderLinesInactiveUntil2102Release
      summary: Get Order Lines - Inactive until 2102 Release
      tags:
      - Order
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: branch
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster branch.
      - name: order
        in: query
        required: false
        schema:
          type: string
          maxLength: 6
        description: Required When Audit Date Is Not Sent.
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: open
          enum:
          - open
          - closed
          - both
        description: Job Status.
      - name: startdate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks at Job Audit Date in Range.
      - name: enddate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - - Looks at Job Audit Date in Range.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
    post:
      operationId: createOrderLine
      summary: Create Order Line
      tags:
      - Order
      description: 'Creates a line on an existing order. Returns the key (header info) of the order updated.


        Only one of these parameters (ordlseq, ordlb2bsku, ordlbarcode) is required. If more than one is passed they execute in the precedence of ordlseq > ordlb2bsku > ordlbarcode'
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  maxLength: 2
                  description: RollMaster company.
                branch:
                  type: string
                  maxLength: 2
                  description: RollMaster branch.
                order:
                  type: string
                  maxLength: 6
                ordlseq:
                  type: string
                  maxLength: 13
                  description: Catalog sequence
                ordlb2bsku:
                  type: string
                  maxLength: 30
                ordlbarcode:
                  type: string
                  maxLength: 30
                ordlwqty:
                  type: string
                  maxLength: 9
                ordlsqty:
                  type: string
                  maxLength: 9
                ordlprice:
                  type: string
                  maxLength: 9
                laborunitcost:
                  type: string
                  maxLength: 9
                taxable:
                  type: string
                  maxLength: 1
                  description: Y or N
              required:
              - company
              - branch
              - order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
