      - name: startswith
        in: query
        required: false
        schema:
          type: string
          maxLength: 30
        description: Searches shipto address 1 and 2, used only when shaddr1 is not sent.
      - name: startdate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD, required when searching with shaddr1, or when startswith is not sent.
      - name: enddate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD, required when searching with shaddr1, or when startswith is not sent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
