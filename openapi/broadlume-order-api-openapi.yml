                  OLC_TYPE:
                    type: string
                  OLC_COMMENT:
                    type: string
                  OLC_WEBNAME:
                    type: string
                  OLC_DATE:
                    type: string
                  OLC_TIME:
                    type: string
                  OLC_REQUIRED:
                    type: string
                  OLC_NOTE_NUM:
                    type: string
    patch:
      operationId: updateOrderLineComment
      summary: Update Order Line Comment
      tags:
      - Order
