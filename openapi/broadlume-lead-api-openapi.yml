openapi: 3.2.0
info:
  title: Broadlume BMS Lead API
  version: v1
  summary: Business management API for Broadlume BMS, the flooring ERP formerly known as RollMaster.
  description: REST API for Broadlume BMS (formerly RollMaster), Broadlume's business management system for flooring retailers.
  contact:
    name: Broadlume Developer Portal
    url: https://developer.broadlume.com/bms
servers:
- url: https://api.rmaster.com/api
  description: Production
security:
- apiKeyAuth: []
  sessionToken: []
tags:
- name: Lead
paths:
  /{alias}/leadtimeslots:
    get:
      operationId: leadTimeSlots
      summary: Lead Time Slots
      tags:
      - Lead
      description: Get lead time slot list
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
  /{alias}/leadsbydate:
    get:
      operationId: leadsList
      summary: Leads list
      tags:
      - Lead
      description: Leads list by date range
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: both
          enum:
          - open
          - closed
          - both
        description: Optional Lead status
      - name: startdate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Optional Appointment Date
      - name: enddate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Optional Appointment Date
      - name: startdate2
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Optional Last Edited Date
      - name: enddate2
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Optional Last Edited Date
      - name: startdate3
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Optional Created Date
      - name: enddate3
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Optional Created Date
      - name: term
        in: query
        required: false
        schema:
          type: string
          maxLength: 30
        description: Optional Search term for customer name
      - name: ordstatuscode
        in: query
        required: false
        schema:
          type: string
          maxLength: 10
        description: Optional
      - name: page
        in: query
        required: false
        schema:
          type: number
          maxLength: 4
          default: '1'
        description: Used to offset data by 'page'. Used in conjunction with 'pagelimit' parameter to limit the amount of records per page.
      - name: pagelimit
        in: query
        required: false
        schema:
          type: number
          maxLength: 4
          default: '1000'
        description: Limit of records allowed per 'page' of data. Used with the 'page' parameter to offset records and get chunks of a return.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
  /{alias}/lead:
    post:
      operationId: createsLead
      summary: Creates Lead
      tags:
      - Lead
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: rooms[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Selected Rooms
      - name: pctypes[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Selected Product Types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  maxLength: 2
                  description: RollMaster company.
                branch:
                  type: string
                  maxLength: 2
                  description: RollMaster branch.
                jobstat:
                  type: string
                  maxLength: 10
                  description: Lead status
                leadfirstname:
                  type: string
                  maxLength: 20
                leadlastname:
                  type: string
                  maxLength: 20
                shaddr1:
                  type: string
                  maxLength: 30
                shaddr2:
                  type: string
                  maxLength: 30
                shcity:
                  type: string
                  maxLength: 30
                shstate:
                  type: string
                  maxLength: 30
                shzip:
                  type: string
                  maxLength: 30
                  description: Required when company control is on.
                leadphone1:
                  type: string
                  maxLength: 12
                  description: Format - 111-111-1111.
                text1:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                leadphone2:
                  type: string
                  maxLength: 12
                  description: Format - 111-111-1111
                text2:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                leadphone3:
                  type: string
                  maxLength: 12
                  description: Format - 111-111-1111
                text3:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                leademail:
                  type: string
                  maxLength: 120
                  description: Required when company control is on.
                date:
                  type: string
                  maxLength: 8
                  description: Format - YYYYMMDD
                leadtime:
                  type: string
                  maxLength: 8
                ordsalesrep1:
                  type: string
                  maxLength: 3
                special:
                  type: string
                  maxLength: 20
                territory:
                  type: string
                  maxLength: 8
                quicknote:
                  type: string
                  maxLength: 30
                po:
                  type: string
                  maxLength: 13
                canceled:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                duplicate:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                otherfirst:
                  type: string
                  maxLength: 20
                otherlast:
                  type: string
                  maxLength: 20
                crossstreets:
                  type: string
                  maxLength: 20
                commcode:
                  type: string
                  maxLength: 2
                zone:
                  type: string
                  maxLength: 10
                married:
                  type: string
                  maxLength: 1
                  description: Y for Yes N for No
                homeowner:
                  type: string
                  maxLength: 1
                  description: Y for Yes N for No
                subterritory:
                  type: string
                  maxLength: 10
                budget:
                  type: string
                  maxLength: 8
                gclid:
                  type: string
              required:
              - company
              - branch
              - leadfirstname
              - leadlastname
              - shaddr1
              - shcity
              - shstate
              - leadphone1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  LEAD_UPDATED:
                    type: string
    patch:
      operationId: updateLead
      summary: Update lead
      tags:
      - Lead
      parameters:
