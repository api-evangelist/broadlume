                text2:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                leadphone3:
                  type: string
                  maxLength: 12
                  description: Format - 111-111-1111
                text3:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                leademail:
                  type: string
                  maxLength: 120
                  description: Required when company control is on.
                date:
                  type: string
                  maxLength: 8
                  description: Format - YYYYMMDD
                leadtime:
                  type: string
                  maxLength: 8
                ordsalesrep1:
                  type: string
                  maxLength: 3
                special:
                  type: string
                  maxLength: 20
                territory:
                  type: string
                  maxLength: 8
                quicknote:
                  type: string
                  maxLength: 30
                po:
                  type: string
                  maxLength: 13
                canceled:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                duplicate:
                  type: string
                  maxLength: 1
                  description: 1 for Yes 0 for No
                otherfirst:
                  type: string
                  maxLength: 20
                otherlast:
                  type: string
                  maxLength: 20
                crossstreets:
                  type: string
                  maxLength: 20
                commcode:
                  type: string
                  maxLength: 2
                zone:
                  type: string
                  maxLength: 10
                married:
                  type: string
                  maxLength: 1
                  description: Y for Yes N for No
                homeowner:
                  type: string
                  maxLength: 1
                  description: Y for Yes N for No
                subterritory:
                  type: string
                  maxLength: 10
                budget:
                  type: string
                  maxLength: 8
                gclid:
                  type: string
              required:
              - company
              - branch
              - leadfirstname
              - leadlastname
              - shaddr1
              - shcity
              - shstate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  LEAD_CODIV:
                    type: string
                  LEAD_WHSE:
                    type: string
                  LEAD_NUMBER:
                    type: string
                  LEAD_STATUS:
                    type: string
                  LEAD_STATUS_CODE:
                    type: string
                  LEAD_DATE:
                    type: string
                  LEAD_CUST_FIRST_NAME:
                    type: string
                  LEAD_CUST_LAST_NAME:
                    type: string
                  LEAD_CUST_ADDR1:
                    type: string
                  LEAD_CUST_ADDR2:
                    type: string
                  LEAD_CUST_CITY:
