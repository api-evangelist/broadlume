openapi: 3.2.0
info:
  title: Broadlume BMS Quote API
  version: v1
  summary: Business management API for Broadlume BMS, the flooring ERP formerly known as RollMaster.
  description: REST API for Broadlume BMS (formerly RollMaster), Broadlume's business management system for flooring retailers.
  contact:
    name: Broadlume Developer Portal
    url: https://developer.broadlume.com/bms
servers:
- url: https://api.rmaster.com/api
  description: Production
security:
- apiKeyAuth: []
  sessionToken: []
tags:
- name: Quote
paths:
  /{alias}/quotes:
    get:
      operationId: quotesByFollowUpDateRange
      summary: Quotes by follow up date range
      tags:
      - Quote
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: branch
        in: query
        required: false
        schema:
          type: string
          maxLength: 2
      - name: startdate
        in: query
        required: true
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks up Follow-Up Date.
      - name: enddate
        in: query
        required: true
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks up Follow-Up Date
      - name: startdate2
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks up Created Date.
      - name: enddate2
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks up Created Date.
      - name: customer
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Optional
      - name: status
        in: query
        required: false
        schema:
          type: string
          maxLength: 7
        description: Optional, open/closed/both
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
  /{alias}/quote:
    post:
      operationId: createQuote
      summary: Create Quote
      tags:
      - Quote
      description: Creates an Quote. Returns the key (header info) of the Quote updated. Only fields sent will update.
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  maxLength: 2
                  description: RollMaster company.
                branch:
                  type: string
                  maxLength: 2
                  description: RollMaster branch.
                ordstatus:
                  type: string
                  maxLength: 12
                custpo:
                  type: string
                  maxLength: 15
                ordcustid:
                  type: string
                  maxLength: 8
                ordtype:
                  type: string
                  maxLength: 1
                ordsalesrep1:
                  type: string
                  maxLength: 3
                  description: Note - assumes user salesperson initials if not sent and if user is salesperson.
                ordsalesrep2:
                  type: string
                  maxLength: 3
                ordjobtype:
                  type: string
                  maxLength: 2
                ordstatuscode:
                  type: string
                  maxLength: 10
                shcode:
                  type: string
                  maxLength: 4
                shname:
                  type: string
                  maxLength: 30
                shaddr1:
                  type: string
                  maxLength: 30
                shaddr2:
                  type: string
                  maxLength: 30
                shctyst:
                  type: string
                  maxLength: 30
                shcity:
                  type: string
                  maxLength: 30
                shstate:
                  type: string
                  maxLength: 30
                shzip:
                  type: string
                  maxLength: 10
                shbuilding:
                  type: string
                  maxLength: 23
                  description: When used, will override shaddr2 field
                shunit:
                  type: string
                  maxLength: 6
                  description: When used, will override shaddr2 field
                insdate:
                  type: string
                  maxLength: 8
                  description: YYYYMMDD Changes the followup date or quote.
              required:
              - company
              - branch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  QMO_CODIV:
                    type: string
                  QMO_WHSE:
                    type: string
                  QMO_ORDNO:
                    type: string
                  QMH_STATUS:
                    type: string
                  QMH_STATUSCODE:
                    type: string
                  QMH_CUSTID:
                    type: string
                  QMH_TYPE:
                    type: string
                  QMH_SHCODE:
                    type: string
                  QMH_SHNAME:
                    type: string
                  QMH_SHADDR1:
                    type: string
                  QMH_SHADDR2:
                    type: string
                  QMH_SHCITY:
                    type: string
                  QMH_SHSTATE:
                    type: string
                  QMH_SHZIP:
                    type: string
                  QMH_JOBTYPE:
                    type: string
                  QMH_JOBNUM:
                    type: string
                  QMH_TAXTYPE:
                    type: string
                  QMH_SPECIAL1:
                    type: string
                  QMH_JOBTOTAL:
                    type: string
                  QMH_WONUM:
                    type: string
                  QMH_CUSTPO:
                    type: string
                  QMH_ATTN:
                    type: string
                  QMH_QRDNO:
                    type: string
                  QMH_INSTALLDATE:
                    type: string
                  QMH_DATE:
                    type: string
                  QMH_SHPHONE1:
                    type: string
                  QMH_SHFAX:
                    type: string
                  QMH_SHCONTACT:
                    type: string
                  QMH_INSDATE_INITIALS:
                    type: string
                  QMH_TYPEDESC:
                    type: string
                  QMH_CARE:
                    type: string
                  QMH_ORDEREDBY:
                    type: string
                  QMH_SMOP:
                    type: string
                  QRDE_EMAIL:
                    type: string
                  QMH_SALESREP1:
                    type: string
                  QMH_SALESREP1_NAME:
                    type: string
                  QMH_SALESREP1_PHONE1:
                    type: string
                  QMH_SALESREP1_PHONE2:
