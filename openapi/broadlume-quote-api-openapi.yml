                    type: string
                  QMH_SALESREP2_NAME:
                    type: string
                  QMH_SALESREP2_PHONE1:
                    type: string
                  QMH_SALESREP2_PHONE2:
                    type: string
                  C_NAME:
                    type: string
                  C_PHONE:
                    type: string
                  C_PHONE2:
                    type: string
                  C_FAX:
                    type: string
                  C_EMAIL:
                    type: string
    patch:
