  /{alias}/quoteline:
    post:
      operationId: createQuoteLine
      summary: Create Quote Line
      tags:
      - Quote
      description: 'Creates a line on an existing quote. Returns the key (header info) of the quote updated.


        Only one of these parameters (ordlseq, ordlb2bsku, ordlbarcode) is required. If more than one is passed they execute in the precedence of ordlseq > ordlb2bsku > ordlbarcode'
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  maxLength: 2
                  description: RollMaster company.
                branch:
                  type: string
                  maxLength: 2
                  description: RollMaster branch.
                quote:
                  type: string
                  maxLength: 6
                ordlseq:
                  type: string
                  maxLength: 13
                ordlb2bsku:
                  type: string
                  maxLength: 30
                ordlbarcode:
                  type: string
                  maxLength: 30
                ordlwqty:
                  type: string
                  maxLength: 9
                ordlsqty:
                  type: string
                  maxLength: 9
                ordlprice:
                  type: string
                  maxLength: 9
                laborunitcost:
                  type: string
                  maxLength: 9
                taxable:
                  type: string
                  maxLength: 1
                  description: Y or N
              required:
              - company
              - branch
              - quote
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  CO:
                    type: string
                  BR:
                    type: string
                  QRDNO:
                    type: string
                  LINE:
                    type: string
    get:
      operationId: getQuoteLines
      summary: Get quote lines
      tags:
      - Quote
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: branch
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster branch.
      - name: quote
        in: query
        required: true
        schema:
          type: string
          maxLength: 6
      - name: lnnum
        in: query
        required: false
        schema:
          type: string
          maxLength: 3
        description: Optional - Sending will return single requested line.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  QMI_ORDNO:
                    type: string
                  QMI_LNNUM:
                    type: string
                  QMI_RECSTAT:
                    type: string
                  QMI_CAT_SEQUENCE:
                    type: string
                  QMI_PRODCODE:
                    type: string
                  QMI_STYLE:
                    type: string
                  QMI_STYNUMBER:
                    type: string
                  QMI_COLOR:
                    type: string
                  QMI_COLNUMBER:
                    type: string
                  QMI_QTYASSIGNED:
                    type: string
                  QMI_SQUANTITY:
                    type: string
                  QMI_WQUANTITY:
                    type: string
                  QMI_SUNITS:
                    type: string
                  QMI_WUNITS:
                    type: string
                  QMI_PRICE:
                    type: string
                  QMI_TOTAL:
                    type: string
                  QMI_PONO:
                    type: string
                  QMI_TAXYN:
                    type: string
                  QMI_TAX:
                    type: string
                  QMI_INSTRUCTIONS:
                    type: string
                  QMI_BUNDLE_SEQ:
                    type: string
                  BQ_BUNDLE_NAME:
                    type: string
    patch:
      operationId: updateQuoteLine
      summary: Update Quote Line
      tags:
      - Quote
      description: Updates a line on an existing quote. Returns the key (header info) of the quote updated.
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: branch
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster branch.
      - name: quote
        in: query
