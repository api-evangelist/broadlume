                C_TERR:
                  type: string
                  maxLength: 30
                C_STAT:
                  type: string
                  maxLength: 30
                C_CONTACT:
                  type: string
                  maxLength: 30
                C_PHONE2:
                  type: string
                  maxLength: 15
                  description: Format '999-999-9999'
                C_FAX:
                  type: string
                  maxLength: 30
                  description: Format '999-999-9999'
                C_TAXID:
                  type: string
                  maxLength: 30
                C_SLSID:
                  type: string
                  maxLength: 30
                C_EMAIL:
                  type: string
                  maxLength: 100
                C_PRICE_LEVEL_DEFAULT:
                  type: string
                  maxLength: 30
                C_CUSTTYPE:
                  type: string
                  maxLength: 30
                C_PROMPMGMT_CO:
                  type: string
                  maxLength: 30
                C_NAME_LONG:
                  type: string
                  maxLength: 100
                C_CITY:
                  type: string
                  maxLength: 30
                C_STATE:
                  type: string
                  maxLength: 30
              required:
              - COMPANY
              - C_CID
              - C_WHSE
              - C_NAME
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  RETURN:
                    type: string
    patch:
