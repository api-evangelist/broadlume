openapi: 3.2.0
info:
  title: Broadlume BMS Customer API
  version: v1
  summary: Business management API for Broadlume BMS, the flooring ERP formerly known as RollMaster.
  description: REST API for Broadlume BMS (formerly RollMaster), Broadlume's business management system for flooring retailers.
  contact:
    name: Broadlume Developer Portal
    url: https://developer.broadlume.com/bms
servers:
- url: https://api.rmaster.com/api
  description: Production
security:
- apiKeyAuth: []
  sessionToken: []
tags:
- name: Customer
paths:
  /{alias}/customers:
    get:
      operationId: customerList
      summary: Customer List
      tags:
      - Customer
      description: Get all current customers. Can be used to find customers with last invoice date within date range, last pay date in date range, or last edited date of customer record.
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: startdate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks for Last Invoice date, Last Pay date, or Last Edit date in range. If no date range is sent, a full list of customers will be returned.
      - name: enddate
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks for Last Invoice date, Last Pay date, or Last Edit date in range. If no date range is sent, a full list of customers will be returned.
      - name: type
        in: query
        required: false
        schema:
          type: string
          maxLength: 2
        description: Sending a type Value of 'PC' along with a product code will return customers who have purchased that product in the date range. A value of 'EDIT' and passing 'startdate' and 'enddate' or 'lastdays' will return only customer records that have been edited within that timeframe.
      - name: prodcode
        in: query
        required: false
        schema:
          type: string
          maxLength: 2
        description: Sending a type Value of PC along with a product code will return customers who have purchased that product in the date range.
      - name: startdate2
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks customer creation date.
      - name: enddate2
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: Format - YYYYMMDD - Looks customer creation date.
      - name: lastdays
        in: query
        required: false
        schema:
          type: string
          maxLength: 4
        description: Last X days of data to call for. Same as calling for startdate through enddate of X days ago to today. Call for either startdate/enddate OR lastdays. Lastdays WILL OVERRIDE startdate/enddate.
      - name: salesid
        in: query
        required: false
        schema:
          type: string
          maxLength: 3
      - name: salesid2
        in: query
        required: false
        schema:
          type: string
          maxLength: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: array
                    items:
                      type: string
  /{alias}/customer:
    get:
      operationId: customerInfo
      summary: Customer info
      tags:
      - Customer
      description: Get customer info. Either customer or customername are required.
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: The clientid for the API call.
      - name: company
        in: query
        required: true
        schema:
          type: string
          maxLength: 2
        description: RollMaster company.
      - name: customer
        in: query
        required: false
        schema:
          type: string
          maxLength: 8
        description: (required if customername is not passed) References the customer id field. Leading spaces need to be filled with websafe spacing.
      - name: customername
        in: query
        required: false
        schema:
          type: string
          maxLength: 30
        description: (required if customer is not passed) References the customer name. Spaces need to be filled with websafe spacing.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  C_CID:
                    type: string
                  C_NAME:
                    type: string
                  C_ADDR1:
                    type: string
                  C_ADDR2:
                    type: string
                  C_CTYST:
                    type: string
                  C_ZIPCD:
                    type: string
                  C_PHONE:
                    type: string
                  C_TERRFLAG:
                    type: string
                  C_TERR:
                    type: string
                  C_DAYS:
                    type: string
                  C_NET:
                    type: string
                  C_FINCHG:
                    type: string
                  C_CHGPCT:
                    type: string
                  C_CHGDAYS:
                    type: string
                  C_STAT:
                    type: string
                  C_CRSTATUS:
                    type: string
                  C_CONTACT:
                    type: string
                  C_PHONE2:
                    type: string
                  C_FAX:
                    type: string
                  C_TAXID:
                    type: string
                  C_CURR_CREDIT:
                    type: string
                  C_CURR_CREDIT_FLOAT:
                    type: string
                  C_CURR_CREDIT_DISP:
                    type: string
                  C_TERMS:
                    type: string
                  C_SALES:
