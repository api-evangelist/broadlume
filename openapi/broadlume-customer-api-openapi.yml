                  C_LAST_PAY:
                    type: string
                  C_LAST_INV:
                    type: string
                  C_LAST_ORDER:
                    type: string
                  C_EMAIL:
                    type: string
                  C_TERMS_DISP:
                    type: string
                  C_AVG_PAY:
                    type: string
                  C_ONORDER:
                    type: string
                  C_ARDUE:
                    type: string
                  C_CITY:
                    type: string
                  C_STATE:
                    type: string
                  C_COUNTRY:
                    type: string
                  C_PRICE:
                    type: string
                  SAL_NAME:
                    type: string
                  C_CUSTTYPE:
                    type: string
    post:
